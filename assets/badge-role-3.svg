</filter>
</defs>
<g filter="url(#ps)">
  <rect x="0.5" y="0.5" width="148" height="29" rx="9" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="148" height="29" rx="9" fill="url(#pg)"/>
  <rect x="0.5" y="0.5" width="148" height="29" rx="9" fill="url(#pt)"/>
</g>
<rect x="0.5" y="0.5" width="148" height="29" rx="9" fill="none" stroke="url(#pe)" stroke-width="1"/>
<rect x="30" y="1" width="89" height="1" fill="url(#ph)"/>
<circle cx="16.6" cy="15.0" r="4.2" fill="#38BDF8" opacity="0.45" filter="url(#pdg)"/>
<circle cx="16.6" cy="15.0" r="2.6" fill="#38BDF8"/>
<text class="t" x="28.7" y="18.7" font-size="10.5" font-weight="600"
