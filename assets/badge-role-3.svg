<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 149 30" width="149" height="30" role="img" aria-label="TECH EXPLORER">
<defs>
<style type="text/css"><![CDATA[
@font-face{font-family:'Inter';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
.t{font-family:'Inter',ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif}
]]></style>
<clipPath id="pc"><rect width="149" height="30" rx="9"/></clipPath>

<linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.055"/>
  <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.022"/>
  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.010"/>
</linearGradient>
<linearGradient id="pe" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.155"/>
  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.050"/>
</linearGradient>
<linearGradient id="ph" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
  <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.17"/>
  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<radialGradient id="pa" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.30"/>
  <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
</radialGradient>
<linearGradient id="pr" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
