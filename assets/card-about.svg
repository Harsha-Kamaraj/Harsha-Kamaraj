  <rect x="0.5" y="0.5" width="1199" height="273" rx="18" fill="url(#ag)"/>
</g>
<g clip-path="url(#ac)">
  <ellipse cx="1160" cy="10" rx="150" ry="80" fill="url(#aa)" filter="url(#ab)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="24s" repeatCount="indefinite"/>
  </ellipse>
</g>
<rect x="0.5" y="0.5" width="1199" height="273" rx="18" fill="none" stroke="url(#ae)" stroke-width="1"/>
<rect x="264" y="1" width="672" height="1" fill="url(#ah)"/>
<rect x="30" y="37.0" width="32" height="32" rx="10" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.085" stroke-width="1"/>
