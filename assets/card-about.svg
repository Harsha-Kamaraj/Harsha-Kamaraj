<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 274" width="1200" height="274" role="img" aria-label="About Harsha K">
<defs>
<style type="text/css"><![CDATA[
@font-face{font-family:'Inter';font-style:normal;font-weight:480;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
.t{font-family:'Inter',ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif}
]]></style>
<clipPath id="ac"><rect width="1200" height="274" rx="18"/></clipPath>

<linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.055"/>
  <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.022"/>
  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.010"/>
</linearGradient>
<linearGradient id="ae" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.155"/>
  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.050"/>
</linearGradient>
<linearGradient id="ah" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
  <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.17"/>
  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<radialGradient id="aa" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#5B9DF9" stop-opacity="0.30"/>
  <stop offset="100%" stop-color="#5B9DF9" stop-opacity="0"/>
</radialGradient>
<linearGradient id="ar" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#5B9DF9" stop-opacity="0.45"/>
  <stop offset="100%" stop-color="#5B9DF9" stop-opacity="0"/>
</linearGradient>
<filter id="as" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
  <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.42"/>
</filter>
<filter id="ab" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
  <feGaussianBlur stdDeviation="34"/>
</filter>
