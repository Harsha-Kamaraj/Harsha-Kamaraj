<text class="t" x="80" y="114.8" font-size="16.5" letter-spacing="0.1"><tspan font-weight="480" fill="#C8D4E6" fill-opacity="0.72">I build </tspan><tspan font-weight="600" fill="#E9EFF7" fill-opacity="0.96">full-stack web applications</tspan><tspan font-weight="480" fill="#C8D4E6" fill-opacity="0.72"> with the MERN stack, Django, FastAPI and Next.js</tspan></text>
<rect x="30" y="149.0" width="32" height="32" rx="10" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.085" stroke-width="1"/>
<g transform="translate(38,157.0)"><g transform="scale(0.6667)" fill="none" stroke="#5B9DF9" stroke-opacity="0.85" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2l2.1 5.9 5.9 2.1-5.9 2.1-2.1 5.9-2.1-5.9L4 11.2l5.9-2.1z"/></g></g>
<text class="t" x="80" y="170.8" font-size="16.5" letter-spacing="0.1"><tspan font-weight="480" fill="#C8D4E6" fill-opacity="0.72">Currently exploring </tspan><tspan font-weight="600" fill="#E9EFF7" fill-opacity="0.96">Computer Vision, NLP and Prompt Engineering</tspan><tspan font-weight="480" fill="#C8D4E6" fill-opacity="0.72"> — teaching machines to see and read</tspan></text>
<rect x="30" y="205.0" width="32" height="32" rx="10" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.085" stroke-width="1"/>
<g transform="translate(38,213.0)"><g transform="scale(0.6667)" fill="none" stroke="#5B9DF9" stroke-opacity="0.85" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M16.4 20.6v-1.7a4 4 0 00-4-4H6.1a4 4 0 00-4 4v1.7M9.2 10.9a4 4 0 100-8 4 4 0 000 8M21.9 20.6v-1.7a4 4 0 00-3-3.9M15.6 3.2a4 4 0 010 7.7"/></g></g>
<text class="t" x="80" y="226.8" font-size="16.5" letter-spacing="0.1"><tspan font-weight="480" fill="#C8D4E6" fill-opacity="0.72">Open to </tspan><tspan font-weight="600" fill="#E9EFF7" fill-opacity="0.96">collaboration</tspan><tspan font-weight="480" fill="#C8D4E6" fill-opacity="0.72"> on interesting projects and </tspan><tspan font-weight="600" fill="#E9EFF7" fill-opacity="0.96">new opportunities</tspan></text>
