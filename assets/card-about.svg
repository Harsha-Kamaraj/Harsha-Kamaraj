<text class="t" x="80" y="58.8" font-size="16.5" letter-spacing="0.1"><tspan font-weight="600" fill="#E9EFF7" fill-opacity="0.96">B.Tech in Computer Science Engineering</tspan><tspan font-weight="480" fill="#C8D4E6" fill-opacity="0.72"> @ PES University</tspan></text>
<rect x="30" y="93.0" width="32" height="32" rx="10" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.085" stroke-width="1"/>
