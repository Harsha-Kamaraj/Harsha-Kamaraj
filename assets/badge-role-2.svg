<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160.2 28" width="160.2" height="28" role="img" aria-label="AI/ML ENTHUSIAST">
<defs>
<style type="text/css"><![CDATA[
@font-face{font-family:'SpaceGrotesk';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
.n{font-family:'SpaceGrotesk',ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif}
]]></style>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
  <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.045"/>
  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.022"/>
</linearGradient>
<linearGradient id="tint" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.16"/>
  <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.03"/>
  <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
</linearGradient>
<filter id="sh" x="-30%" y="-60%" width="160%" height="240%" color-interpolation-filters="sRGB">
  <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.42"/>
</filter>
<filter id="dg" x="-350%" y="-350%" width="800%" height="800%" color-interpolation-filters="sRGB">
  <feGaussianBlur stdDeviation="2"/>
</filter>
</defs>

<g filter="url(#sh)">
  <rect x="0.5" y="0.5" width="159.2" height="27" rx="8" fill="url(#g)"/>
  <rect x="0.5" y="0.5" width="159.2" height="27" rx="8" fill="url(#tint)"/>
  <rect x="0.5" y="0.5" width="159.2" height="27" rx="8" fill="none" stroke="url(#edge)" stroke-width="1"/>
</g>
<circle cx="15.5" cy="14.0" r="4.2" fill="#8B5CF6" opacity="0.55" filter="url(#dg)"/>
<circle cx="15.5" cy="14.0" r="2.5" fill="#8B5CF6"/>
<text class="n" x="27.0" y="17.85" font-size="11.0" font-weight="500" letter-spacing="1.45"
